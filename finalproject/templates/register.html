<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrimony Registration</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="text" name="gender" placeholder="Gender" required>
        <input type="text" name="height" placeholder="Height" required>
        <input type="text" name="job_designation" placeholder="Job Designation" required>
        <input type="text" name="job_place" placeholder="Job Place" required>
        <input type="text" name="district" placeholder="District" required>
        <input type="text" name="religion" placeholder="Religion" required>
        <input type="text" name="caste" placeholder="Caste" required>
        <select name="marriage_level">
            <option value="newly_married">Newly Married</option>
            <option value="remarriage">Remarriage</option>
        </select>
        <input type="text" name="mother_name" placeholder="Mother's Name" required>
        <input type="text" name="father_name" placeholder="Father's Name" required>
        <input type="text" name="sibling_name" placeholder="Sibling Name" required>
        <input type="text" name="sibling_status" placeholder="Sibling Status (Married/Unmarried)" required>
        <input type="file" name="profile_pictures" required multiple>
        <button type="submit">Register</button>
    </form>
</body>
</html>
