<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
</head>
<body>
    <h1>Admin Dashboard</h1>

    <h3>User Approvals</h3>
    <ul>
        {% for user in users %}
            <li>
                <p>{{ user.user.username }} - {{ user.user.email }}</p>
                <form method="POST" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" name="approve_user" value="{{ user.user.id }}">Approve</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
