<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{ chat.sender.username }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            max-width: 70%;
        }
        .sender-message {
            background-color: lightgreen;
            align-self: flex-start;
        }
        .receiver-message {
            background-color: lightgray;
            align-self: flex-end;
        }
        textarea {
            width: 100%;
            height: 60px;
            margin-top: 20px;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Chat with {{ chat.sender.username }}</h1>
    
    <div class="chat-container">
        {% for message in messages %}
            <div class="message {% if message.sender == request.user %} sender-message {% else %} receiver-message {% endif %}">
                <strong>{{ message.sender.username }}:</strong> {{ message.message }}
            </div>
        {% endfor %}
    </div>

    <form method="POST" action="{% url 'send_message' chat.id %}">
        {% csrf_token %}
        <textarea name="message" placeholder="Type your message here..."></textarea>
        <button type="submit">Send</button>
    </form>

</body>
</html>
